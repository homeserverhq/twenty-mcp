version: 1
repo: twenty-mcp
framework: fastmcp-3

server:
  url_env: MCP_URL
  default_url: "http://localhost:${MCP_SERVER_PORT:-80}/mcp"
  transport: streamable_http_sse
  stateful: false
  initialize_timeout: 15
  call_timeout: 120

auth:
  type: bearer
  token_env: API_KEY
  token_kind: opaque
  token_scope: workspace
  identity: jwt_decode

decode:
  item_fields: [items]
  string_encodings: [toon]
  envelope_keys: [items, total_count, page_info]

backend:
  kind: http_api
  base_url_env: TWENTY_BASE_URL
  auth: reuse_token

projection:
  aggregate_flag_env: ALLOW_ALL_AGGREGATE
  parameter: include_all_fields
  single_record_honors: true
  aggregate_honors_when_flag: true

capabilities:
  binary: false
  documents: false
  search: false
  sharing: false
  soft_delete: false
  multi_workspace: false
  cursor_pagination: true
  env_gated_projection: true

safety:
  fixture_prefix: "MCPAudit-{run}-"
  allow_destructive: true
  require_owned_ids: true

workspace_member:
  reversible_fields: [colorScheme, locale]
  env_email: AUDIT_WORKSPACE_MEMBER_EMAIL
  env_id: AUDIT_WORKSPACE_MEMBER_ID

domains:
  - schema
  - status
  - resources
  - projection
  - pagination
  - bulk
  - timestamps
  - workspace_members
  - errors
  - isolation
  - residue
